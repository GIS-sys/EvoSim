[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evosim"
version = "0.1.0"
description = "GPU-accelerated artificial-life simulator: genome VM, emergent multicellularity, physical sensing"
requires-python = ">=3.11"
dependencies = ["warp-lang", "numpy", "zstandard", "pyyaml"]

[project.optional-dependencies]
ui = ["glfw", "moderngl", "imgui-bundle", "PyOpenGL"]
extras = ["pyarrow", "psutil", "pillow", "nvidia-ml-py"]
test = ["pytest"]

[project.scripts]
evosim = "evosim.cli:main"

[tool.setuptools.packages.find]
include = ["evosim*"]
